name: FIM quality

on:
  pull_request:
    branches:
      - workflow/shared-context
      - release/**
  push:
    branches:
      - workflow/shared-context
      - release/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test the policy checker
        shell: pwsh
        run: ./governance/tests/Test-HutchinsPolicy.ps1
      - name: Enforce policy for this change
        shell: pwsh
        run: |
          $base = if ($env:GITHUB_BASE_REF) { "origin/$env:GITHUB_BASE_REF" } else { "origin/workflow/shared-context" }
          ./scripts/Test-HutchinsPolicy.ps1 -BaseRef $base
  r-quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
          # Parsing and synthetic tests do not compile native code.
          rtools-version: none
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - name: Parse human-authored R sources
        run: >-
          Rscript -e 'shiny <- list.files("shiny", pattern = "\\.R$", full.names = TRUE, recursive = TRUE); shiny <- shiny[!grepl("^shiny/renv/", shiny)]; files <- c(list.files("R", pattern = "\\.R$", full.names = TRUE), list.files("scripts", pattern = "\\.R$", full.names = TRUE), list.files("data-raw", pattern = "\\.R$", full.names = TRUE), shiny, list.files(".", pattern = "^fiscal_impact.*\\.R$", full.names = TRUE)); invisible(lapply(files, parse)); cat("Parsed", length(files), "R files\\n")'
      - name: Run synthetic package tests
        run: Rscript -e 'testthat::test_local(".", reporter = "summary")'
